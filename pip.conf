# pip configuration for this project (consumed by scripts/setup.sh).
#
# pip does NOT read this file from the project root: the setup script copies it
# into .venv/pip.conf, which is the "site" config location pip actually reads
# for a virtualenv. That keeps the change venv-scoped — nothing global is
# touched.
#
# Why these settings:
#   * index-url = official PyPI. The default index resolution in this
#     environment intermittently served artifacts that failed hash
#     verification ("THESE PACKAGES DO NOT MATCH THE HASHES"), with the
#     expected hash changing between runs. An explicit official index is
#     stable here.
#   * no-cache-dir = true. The transparent network layer also serves stale or
#     corrupt cached responses; disabling pip's HTTP cache avoids reusing
#     poisoned entries. Install time is still fine for this dependency set.

[global]
index-url = https://pypi.org/simple
no-cache-dir = true
